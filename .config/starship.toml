# ~/.config/starship.toml

[username]
style_user = "white bold"
style_root = "black bold"
format = "[$user]($style)"
disabled = false
show_always = true

[hostname]
ssh_only = false
format = "[$ssh_symbol](bold blue)@[$hostname](bold red)"
trim_at = ".prev.com"
disabled = false

[directory]
truncation_length = 8
truncation_symbol = "…/"
format = ":[$path]($style)[$read_only]($read_only_style) "

[status]
disabled = false

[battery]
disabled = true
full_symbol = "🔋 "
charging_symbol = "⚡️ "
discharging_symbol = "💀 "

[time]
disabled = false
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

################################################################################
# git
################################################################################
[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_commit]
tag_symbol = "🔖 "

[git_status]
conflicted = "🏳"
ahead = "🏎💨"
behind = "😰"
diverged = "😵"
up_to_date = "✓"
untracked = "🤷"
stashed = "📦"
modified = "📝"
staged = '[++\($count\)](green)'
renamed = "👅"
deleted = "🗑"
################################################################################
# Programming Langs
################################################################################
[cmake]
disabled = true
[c]
disabled = true
format = '''\[[$name $version]($style)\]'''
commands = [ ["arm-none-eabi-gcc", "--version"], [ "cc", "--version" ], [ "gcc", "--version" ], [ "clang", "--version" ] ]

[java]
disabled = true

[python]
pyenv_version_name = true
disabled = true
